name: Bug report
description: 报告一个可复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索已有 Issue，并确认问题可以复现。
        **不要在这里粘贴真实商家数据、密钥或个人信息。**

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请给出最小、可复现的步骤。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - Web 前端
        - Python 预测引擎
        - 数据生成 / 转换脚本
        - 文档
        - GitHub Actions / 部署
        - 其他
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python、Node、浏览器版本
      placeholder: "Windows 11, Python 3.12, Node 24, Chrome 131"

  - type: textarea
    id: logs
    attributes:
      label: 错误日志 / 截图
      description: 请先脱敏。可以直接粘贴文本或拖入图片。
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 我已搜索过已有 Issue
          required: true
        - label: 我没有在报告中包含真实商家数据或密钥
          required: true
