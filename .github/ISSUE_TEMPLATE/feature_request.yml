name: Feature request
description: 提出一个新功能或改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请先说明使用场景，而不仅是实现方式。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么不方便？谁会被影响？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的方案
      description: 你希望项目如何解决？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法或现有替代品。

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - Web 前端
        - Python 预测引擎
        - 数据脚本
        - 文档
        - 部署 / CI
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 你是否愿意提交 PR？
      options:
        - label: 我愿意尝试实现这个功能
